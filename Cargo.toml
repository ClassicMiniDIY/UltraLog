[package]
name = "ultralog"
version = "3.1.0"
edition = "2024"
# egui/eframe 0.36 is the binding constraint on the minimum supported Rust
# version; edition 2024 itself only needs 1.85.
rust-version = "1.95"
description = "A high-performance ECU log viewer written in Rust"
authors = ["Cole Gentry"]
license = "AGPL-3.0"
repository = "https://github.com/ClassicMiniDIY/UltraLog"
readme = "README.md"
keywords = ["ecu", "datalog", "haltech", "automotive", "tuning"]
categories = ["visualization", "gui"]
default-run = "ultralog"

[[bin]]
name = "ultralog"
path = "src/main.rs"

[[bin]]
name = "test_parser"
path = "src/bin/test_parser.rs"

[dependencies]
# GUI Framework
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "x11",
    "wayland",
] }
egui_plot = "0.38.0"
# Phosphor icons (regular outline; fill for transport and the favourite star).
# 0.14 still requires egui 0.36 and builds its own copy; see Key Dependencies in CLAUDE.md.
egui-phosphor = { version = "0.14", features = ["fill"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# For OpenECU Alliance adapter specs. serde_yml 0.0.12 was flagged unsound
# (RUSTSEC-2025-0068) and is now deprecated; serde_norway is the maintained
# serde_yaml fork whose libyaml backend is also actively maintained.
serde_norway = "0.9.42"

# Parsing
regex = "1.13.1"
strum = { version = "0.28", features = ["derive"] }
rayon = "1.12"  # Parallel iteration for parsing

# Platform-specific directories
dirs = "7.0"

# File handling
rfd = "0.18"  # Native file dialogs
open = "5"    # Open URLs in default browser
memmap2 = "0.9"  # Memory-mapped file loading for large files
encoding_rs = "0.8"  # Character encoding detection and conversion (UTF-16, etc.)

# Auto-update
ureq = { version = "3.5", features = ["json"] }  # Minimal HTTP client
semver = "1.0"  # Version comparison

# Image loading (for app icon, PNG export, and map tiles – Esri serves JPEG)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# PDF generation for chart export
printpdf = "0.12"
# Export rasterizing: glyph outlines (skrifa) filled as paths by vello_cpu for PNG text.
# Same versions epaint already builds; vello_cpu without its glyph-atlas "text" feature.
skrifa = "0.44"
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline"] }

# Error handling
thiserror = "2.0.21"

# Internationalization
rust-i18n = "4.2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID generation for anonymous user IDs
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Clipboard support for histogram copy/paste
arboard = "3.7"

# MCP (Model Context Protocol) server for Claude Desktop integration
rmcp = { version = "3.10", features = ["server", "transport-streamable-http-server", "macros"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
schemars = "1.2"

# Windows-only: ZIP extraction for auto-updates (install_windows in src/updater.rs)
[target.'cfg(windows)'.dependencies]
zip = "9.5"

# Linux-only: tar.gz extraction for auto-updates (install_linux in src/updater.rs)
[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1.1"
tar = "0.4"

# Windows-specific: embed icon and manifest
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# macOS-specific: set app name in dock
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"

[dev-dependencies]
# Note: cargo-tarpaulin is installed as a cargo subcommand, not a library dependency
# Run coverage with: cargo tarpaulin --out Html --exclude-files "src/ui/*" "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# Faster compile times for debug builds
[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
