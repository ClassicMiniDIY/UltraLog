<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Library item — UltraLog</title></head>
<body>
<div class="ul-stage ul-stage--col" style="max-width:460px;gap:8px"><div class="ul-libitem"><div class="ul-libitem__title"><span class="ul-libitem__fx">ƒ</span>TPS Rate<span class="ul-libitem__unit">%/s</span><span class="ul-libitem__star"><svg class="ul-icon ul-icon--fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.8l6-.7z"/></svg></span></div>
    <div class="ul-libitem__formula">(TPS − TPS@-0.1s) * 10</div>
    <div class="ul-libitem__actions"><button class="ul-btn ul-btn--sm">Apply</button><button class="ul-iconbtn" aria-label="More"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg></button></div></div><div class="ul-libitem"><div class="ul-libitem__title"><span class="ul-libitem__fx">ƒ</span>AFR Deviation<span class="ul-libitem__unit">%</span><span class="ul-libitem__star"><svg class="ul-icon ul-icon--fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.8l6-.7z"/></svg></span></div>
    <div class="ul-libitem__formula">(AFR − 14.7) / 14.7 * 100</div>
    <div class="ul-libitem__actions"><button class="ul-btn ul-btn--sm">Apply</button><button class="ul-iconbtn" aria-label="More"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg></button></div></div><div class="ul-libitem"><div class="ul-libitem__title"><span class="ul-libitem__fx">ƒ</span>RPM Z-Score<span class="ul-libitem__unit">σ</span><span class="ul-libitem__star"><svg class="ul-icon ul-icon--fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.8l6-.7z"/></svg></span></div>
    <div class="ul-libitem__formula">(RPM − _mean_RPM) / _stdev_RPM</div>
    <div class="ul-libitem__actions"><button class="ul-btn ul-btn--sm">Apply</button><button class="ul-iconbtn" aria-label="More"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg></button></div></div></div>
</body>
</html>
