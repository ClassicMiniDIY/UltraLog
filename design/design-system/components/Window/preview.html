<!-- @dsCard group="Surfaces" height=330 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Window — UltraLog</title></head>
<body>
<div style="padding:20px;background:var(--bg-base);height:330px">
<div class="ul-window" role="dialog" aria-label="New computed channel">
  <div class="ul-redline"></div>
  <div class="ul-window__head"><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Collapse"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><span class="ul-window__title">New Computed Channel</span><button class="ul-iconbtn" aria-label="Close"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ul-window__body">
    <div class="ul-form" style="grid-template-columns:90px 1fr"><label class="ul-label">Name</label><input class="ul-input" value="Boost (psi)"><label class="ul-label">Unit</label><input class="ul-input" style="width:96px" value="psi"></div>
    <div class="ul-notice ul-notice--info"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/></svg><span>Wrap channel names with spaces in quotes: <span class="ul-mono">"Manifold Pressure"</span>.</span></div>
  </div>
  <div class="ul-window__foot"><button class="ul-btn ul-btn--ghost">Cancel</button><button class="ul-btn">Validate</button><button class="ul-btn ul-btn--primary">Save</button></div>
</div></div>
</body>
</html>
