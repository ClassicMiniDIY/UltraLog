<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Channel list — UltraLog</title></head>
<body>
<div class="ul-chlist">
  <div class="ul-input"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg><span class="ph">Search channels…</span></div>
  <div class="ul-chlist__meta"><span>Selected <b>4</b> / 10</span><span>114 channels</span></div>
  <div class="ul-chlist__group ul-overline"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>With data · 90</div>
  <div class="ul-chrow"><span class="ul-check"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">AFR</span><span style="width:14px"></span><span class="ul-chrow__unit">AFR</span></div>
  <div class="ul-chrow"><span class="ul-check"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">Coolant Temp</span><span style="width:14px"></span><span class="ul-chrow__unit">°C</span></div>
  <div class="ul-chrow is-on"><span class="ul-check is-on"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">Ignition Timing</span><span class="ul-swatch" style="--c:var(--series-4)"></span><span class="ul-chrow__unit">°</span></div>
  <div class="ul-chrow is-on"><span class="ul-check is-on"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">MAP</span><span class="ul-swatch" style="--c:var(--series-3)"></span><span class="ul-chrow__unit">kPa</span></div>
  <div class="ul-chrow"><span class="ul-check"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">Oil Pressure</span><span style="width:14px"></span><span class="ul-chrow__unit">kPa</span></div>
  <div class="ul-chrow is-on"><span class="ul-check is-on"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">RPM</span><span class="ul-swatch" style="--c:var(--series-1)"></span><span class="ul-chrow__unit">rpm</span></div>
  <div class="ul-chrow is-on"><span class="ul-check is-on"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">TPS</span><span class="ul-swatch" style="--c:var(--series-2)"></span><span class="ul-chrow__unit">%</span></div>
  <div class="ul-chrow"><span class="ul-check"><span class="ul-check__box"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span><span class="ul-chrow__name">Vehicle Speed</span><span style="width:14px"></span><span class="ul-chrow__unit">km/h</span></div>
</div>
