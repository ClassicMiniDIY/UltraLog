<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Text field and select — UltraLog</title></head>
<body>
<div class="ul-stage ul-stage--panel ul-stage--col">
<div class="ul-form" style="max-width:520px">
  <label class="ul-label">Engine speed<span class="req">*</span></label>
  <div class="ul-input ul-select"><span>RPM</span><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
  <label class="ul-label">Injector pulse width<span class="req">*</span></label>
  <div class="ul-input ul-select is-focus"><span>Injector 1 On Time</span><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
  <label class="ul-label">Clutch state</label>
  <div class="ul-input ul-select"><span class="ph">Not logged — optional</span><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
  <label class="ul-label">Name</label>
  <input class="ul-input" value="Boost (psi)">
  <label class="ul-label">Columns (X bins)</label>
  <input class="ul-input ul-input--num" value="32">
  <label class="ul-label">Search</label>
  <div class="ul-input"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg><span class="ph">Search channels…</span></div>
</div></div>
</body>
</html>
