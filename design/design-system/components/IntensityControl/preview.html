<!-- @dsCard group="Inputs" height=270 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ultra intensity — UltraLog</title></head>
<body>
<div class="ul-stage ul-stage--panel ul-stage--col" style="gap:16px">
  <div class="ul-intensity">
    <div class="ul-intensity__head"><span class="ul-label">Ultra intensity</span><span class="ul-intensity__name">Night Drive · 35</span></div>
    <div class="ul-intensity__track" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35" aria-valuetext="Night Drive"><div class="ul-intensity__thumb" style="left:35%"></div></div>
    <div class="ul-intensity__stops"><span style="left:0%" class="">Stealth</span><span style="left:35%" class="is-on">Night Drive</span><span style="left:70%" class="">Neon</span><span style="left:100%" class="">Ultra</span></div>
    <div class="ul-caption">How much neon the app wears. Never changes your data colours or text contrast.</div>
  </div>
  <div style="display:flex;gap:10px"><div data-theme="stealth" style="flex:1;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden">
  <div class="ul-redline"></div>
  <div style="padding:10px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="ul-overline">Stealth · 0</span><button class="ul-btn ul-btn--primary ul-btn--sm" style="box-shadow:var(--glow-cyan)">Run</button></div>
    <svg viewBox="0 0 200 54" style="display:block;width:100%;height:54px;background:var(--plot-bg);border-radius:var(--radius-xs)">
      <g style="stroke:var(--plot-floor)"><line x1="100" y1="20" x2="0" y2="54"/><line x1="100" y1="20" x2="60" y2="54"/><line x1="100" y1="20" x2="140" y2="54"/><line x1="100" y1="20" x2="200" y2="54"/><line x1="0" y1="40" x2="200" y2="40"/></g>
      <path d="M0 40 L30 34 L60 38 L90 16 L120 30 L150 22 L200 26" style="fill:none;stroke:var(--series-1);color:var(--series-1);stroke-width:1.5;filter:drop-shadow(var(--bloom-series))"/>
      <path d="M0 46 L40 44 L80 30 L120 36 L160 12 L200 18" style="fill:none;stroke:var(--series-3);color:var(--series-3);stroke-width:1.5;filter:drop-shadow(var(--bloom-series))"/>
      <line x1="112" y1="0" x2="112" y2="54" style="stroke:var(--plot-cursor);stroke-width:1.5"/>
    </svg></div></div><div data-theme="night" style="flex:1;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden">
  <div class="ul-redline"></div>
  <div style="padding:10px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="ul-overline">Night Drive · 35</span><button class="ul-btn ul-btn--primary ul-btn--sm" style="box-shadow:var(--glow-cyan)">Run</button></div>
    <svg viewBox="0 0 200 54" style="display:block;width:100%;height:54px;background:var(--plot-bg);border-radius:var(--radius-xs)">
      <g style="stroke:var(--plot-floor)"><line x1="100" y1="20" x2="0" y2="54"/><line x1="100" y1="20" x2="60" y2="54"/><line x1="100" y1="20" x2="140" y2="54"/><line x1="100" y1="20" x2="200" y2="54"/><line x1="0" y1="40" x2="200" y2="40"/></g>
      <path d="M0 40 L30 34 L60 38 L90 16 L120 30 L150 22 L200 26" style="fill:none;stroke:var(--series-1);color:var(--series-1);stroke-width:1.5;filter:drop-shadow(var(--bloom-series))"/>
      <path d="M0 46 L40 44 L80 30 L120 36 L160 12 L200 18" style="fill:none;stroke:var(--series-3);color:var(--series-3);stroke-width:1.5;filter:drop-shadow(var(--bloom-series))"/>
      <line x1="112" y1="0" x2="112" y2="54" style="stroke:var(--plot-cursor);stroke-width:1.5"/>
    </svg></div></div><div data-theme="ultra" style="flex:1;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden">
  <div class="ul-redline"></div>
  <div style="padding:10px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="ul-overline">Ultra · 100</span><button class="ul-btn ul-btn--primary ul-btn--sm" style="box-shadow:var(--glow-cyan)">Run</button></div>
    <svg viewBox="0 0 200 54" style="display:block;width:100%;height:54px;background:var(--plot-bg);border-radius:var(--radius-xs)">
      <g style="stroke:var(--plot-floor)"><line x1="100" y1="20" x2="0" y2="54"/><line x1="100" y1="20" x2="60" y2="54"/><line x1="100" y1="20" x2="140" y2="54"/><line x1="100" y1="20" x2="200" y2="54"/><line x1="0" y1="40" x2="200" y2="40"/></g>
      <path d="M0 40 L30 34 L60 38 L90 16 L120 30 L150 22 L200 26" style="fill:none;stroke:var(--series-1);color:var(--series-1);stroke-width:1.5;filter:drop-shadow(var(--bloom-series))"/>
      <path d="M0 46 L40 44 L80 30 L120 36 L160 12 L200 18" style="fill:none;stroke:var(--series-3);color:var(--series-3);stroke-width:1.5;filter:drop-shadow(var(--bloom-series))"/>
      <line x1="112" y1="0" x2="112" y2="54" style="stroke:var(--plot-cursor);stroke-width:1.5"/>
    </svg></div></div></div>
</div>
</body>
</html>
