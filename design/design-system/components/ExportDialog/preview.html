<!-- @dsCard group="Export" height=400 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Export dialog — UltraLog</title></head>
<body>
<div style="padding:20px;background:var(--bg-base)">
<div class="ul-window" style="width:480px">
  <div class="ul-redline"></div>
  <div class="ul-window__head"><span class="ul-window__title">Export Chart</span><button class="ul-iconbtn" aria-label="Close"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ul-window__body">
    <div style="display:flex;gap:12px;align-items:center"><span class="ul-label" style="width:64px">Format</span><div class="ul-seg"><button class="ul-seg__item is-active">PDF</button><button class="ul-seg__item">PNG</button></div></div>
    <div class="ul-radio"><label class="ul-radio__opt is-on"><div class="ul-thumb" data-theme="paper" style="background:var(--bg-base)">
      <div class="ul-redline"></div>
      <svg viewBox="0 0 120 50" style="display:block;width:100%;height:50px"><rect x="8" y="8" width="104" height="36" style="fill:var(--plot-bg);stroke:var(--line)"/>
      <path d="M8 36 L30 30 L50 34 L70 16 L90 26 L112 20" style="fill:none;stroke:var(--series-1);stroke-width:1.5"/><path d="M8 40 L40 38 L70 26 L112 14" style="fill:none;stroke:var(--series-2);stroke-width:1.5"/></svg></div>
      <span><b style="font-weight:600">Paper</b><br><small>Light. Default; prints cleanly.</small></span></label><label class="ul-radio__opt"><div class="ul-thumb" data-theme="graphite" style="background:var(--bg-base)">
      <div class="ul-redline"></div>
      <svg viewBox="0 0 120 50" style="display:block;width:100%;height:50px"><rect x="8" y="8" width="104" height="36" style="fill:var(--plot-bg);stroke:var(--line)"/>
      <path d="M8 36 L30 30 L50 34 L70 16 L90 26 L112 20" style="fill:none;stroke:var(--series-1);stroke-width:1.5"/><path d="M8 40 L40 38 L70 26 L112 14" style="fill:none;stroke:var(--series-2);stroke-width:1.5"/></svg></div>
      <span><b style="font-weight:600">Graphite</b><br><small>Dark, ink-saving grey.</small></span></label></div>
    <div class="ul-notice ul-notice--info"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/></svg><span>Exports always use the color-blind safe palette, so anyone you share them with can read them.</span></div>
  </div>
  <div class="ul-window__foot"><button class="ul-btn ul-btn--ghost">Cancel</button><button class="ul-btn ul-btn--primary"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11.5M7 10.5l5 5 5-5M4.5 19.5h15"/></svg>Export PDF</button></div>
</div></div>
</body>
</html>
