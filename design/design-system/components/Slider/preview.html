<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider — UltraLog</title></head>
<body>
<div class="ul-stage ul-stage--panel ul-stage--col" style="gap:14px;max-width:440px">
  <div class="ul-slider"><span class="ul-label" style="width:96px">Window</span><div class="ul-slider__track"><div class="ul-slider__fill" style="width:38%"></div><div class="ul-slider__thumb" style="left:38%"></div></div><input class="ul-input ul-input--num" style="width:64px" value="30 s"></div>
  <div class="ul-slider"><span class="ul-label" style="width:96px">Grid opacity</span><div class="ul-slider__track"><div class="ul-slider__fill" style="width:100%"></div><div class="ul-slider__thumb" style="left:100%"></div></div><input class="ul-input ul-input--num" style="width:64px" value="100 %"></div>
</div>
</body>
</html>
