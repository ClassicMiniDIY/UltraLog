<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Playback bar — UltraLog</title></head>
<body>
<div class="ul-playback">
  <div class="ul-playback__row">
    <button class="ul-transport ul-transport--play" aria-label="Play"><svg class="ul-icon ul-icon--fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
    <button class="ul-transport" aria-label="Stop"><svg class="ul-icon ul-icon--fill" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></button>
    <span class="ul-playback__sep"></span>
    <span class="ul-label">Speed</span><div class="ul-input ul-select" style="width:72px"><span class="ul-mono">1×</span><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
    <span class="ul-playback__sep"></span>
    <span class="ul-playback__time">13:26.000</span>
    <span class="ul-playback__rec">Record <b>40 301</b> / 223 559</span>
  </div>
  <div class="ul-scrub"><span>13:05.000</span><div class="ul-scrub__track"><div class="ul-scrub__fill" style="width:42%"></div><div class="ul-scrub__thumb" style="left:42%"></div></div><span>13:55.000</span></div>
</div>
</body>
</html>
