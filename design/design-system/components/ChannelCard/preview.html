<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Channel card — UltraLog</title></head>
<body>
<div class="ul-stage" style="align-items:stretch"><div class="ul-chcard" style="--c:var(--series-1)">

    <div class="ul-chcard__row"><span class="ul-chcard__k">Min</span><span class="ul-chcard__v">0.0<span class="ul-chcard__u">rpm</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to min"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="ul-chcard__row"><span class="ul-chcard__k">Max</span><span class="ul-chcard__v">6081.0<span class="ul-chcard__u">rpm</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to max"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
  </div><div class="ul-chcard" style="--c:var(--series-2)">

    <div class="ul-chcard__row"><span class="ul-chcard__k">Min</span><span class="ul-chcard__v">0.0<span class="ul-chcard__u">%</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to min"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="ul-chcard__row"><span class="ul-chcard__k">Max</span><span class="ul-chcard__v">88.2<span class="ul-chcard__u">%</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to max"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
  </div><div class="ul-chcard" style="--c:var(--series-3)">

    <div class="ul-chcard__row"><span class="ul-chcard__k">Min</span><span class="ul-chcard__v">-101.3<span class="ul-chcard__u">kPa</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to min"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="ul-chcard__row"><span class="ul-chcard__k">Max</span><span class="ul-chcard__v">92.8<span class="ul-chcard__u">kPa</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to max"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
  </div><div class="ul-chcard" style="--c:var(--series-4)">

    <div class="ul-chcard__row"><span class="ul-chcard__k">Min</span><span class="ul-chcard__v">-18.6<span class="ul-chcard__u">°</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to min"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="ul-chcard__row"><span class="ul-chcard__k">Max</span><span class="ul-chcard__v">38.9<span class="ul-chcard__u">°</span></span><button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to max"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
  </div></div>
