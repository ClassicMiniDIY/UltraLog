<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — UltraLog</title></head>
<body>
<div class="ul-stage ul-stage--col" style="gap:14px">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="ul-btn ul-btn--primary"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4M7 9l5-5 5 5M4.5 19.5h15"/></svg>Select a file</button>
    <button class="ul-btn">Re-run current file</button>
    <button class="ul-btn ul-btn--ghost"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New</button>
    <button class="ul-btn ul-btn--danger">Remove log</button>
    <button class="ul-btn is-focus">Focused</button>
    <button class="ul-btn" disabled>Disabled</button>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="ul-btn ul-btn--sm">Apply</button>
    <button class="ul-btn ul-btn--sm"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11.5M7 10.5l5 5 5-5M4.5 19.5h15"/></svg>PNG</button>
    <button class="ul-btn ul-btn--sm"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11.5M7 10.5l5 5 5-5M4.5 19.5h15"/></svg>PDF</button>
    <button class="ul-btn ul-btn--sm ul-btn--ghost">Copy for paste</button>
    <span style="width:12px"></span>
    <button class="ul-iconbtn" aria-label="Close"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="ul-iconbtn" aria-label="More"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg></button>
    <button class="ul-iconbtn ul-iconbtn--sm" aria-label="Jump to max"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>
</body>
</html>
