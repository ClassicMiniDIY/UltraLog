<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Activity rail — UltraLog</title></head>
<body>
<div style="display:flex;height:240px">
<nav class="ul-rail" aria-label="Panels">
  <button class="ul-rail__btn" aria-label="Files"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10v10.5H3z"/></svg></button>
  <button class="ul-rail__btn is-active" aria-label="Properties"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg></button>
  <button class="ul-rail__btn" aria-label="Tools"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18"/><path d="M4.5 16l4.5-5.5 4 3.5 6.5-8"/></svg></button>
  <div class="ul-rail__spacer"></div>
  <button class="ul-rail__btn" aria-label="Settings"><svg class="ul-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l1.7 2.4 2.9-.5.7 2.9 2.5 1.5-1.3 2.7 1.3 2.7-2.5 1.5-.7 2.9-2.9-.5L12 21.2l-1.7-2.4-2.9.5-.7-2.9-2.5-1.5 1.3-2.7-1.3-2.7 2.5-1.5.7-2.9 2.9.5z"/><circle cx="12" cy="12" r="3"/></svg></button>
</nav>
<div style="flex:1;background:var(--bg-panel);padding:16px"><div style="font:600 18px/24px var(--font-display)">Properties</div><div class="ul-caption" style="margin-top:4px">Panel content sits beside the rail.</div></div>
</div>
</body>
</html>
